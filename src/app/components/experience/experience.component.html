<section id="experience" class="section">
  <div class="container">
    <p class="section-label">Work History</p>
    <h2 class="section-title">Professional <span>Experience</span></h2>
    <div class="section-divider"></div>

    <div class="exp-layout">
      <!-- Company tabs -->
      <div class="exp-tabs">
        <button
          class="exp-tab"
          *ngFor="let exp of experiences; let i = index"
          [class.active]="activeIndex === i"
          (click)="activeIndex = i">
          <div class="tab-company">{{exp.company}}</div>
          <div class="tab-period">{{exp.period}}</div>
          <span class="tab-badge" *ngIf="exp.current">Current</span>
        </button>
      </div>

      <!-- Detail panel -->
      <div class="exp-detail" *ngIf="experiences[activeIndex] as exp">
        <div class="detail-header">
          <div>
            <h3 class="detail-role">{{exp.role}}</h3>
            <p class="detail-company">
              <span class="at">&#64;</span> {{exp.company}}
            </p>
          </div>
          <div class="detail-meta">
            <span class="meta-chip">
              <i class="fas fa-calendar-alt"></i> {{exp.period}}
            </span>
            <span class="meta-chip">
              <i class="fas fa-map-marker-alt"></i> {{exp.location}}
            </span>
          </div>
        </div>

        <p class="detail-desc">{{exp.description}}</p>

        <ul class="achievement-list">
          <li *ngFor="let a of exp.achievements">
            <span class="ach-bullet"><i class="fas fa-chevron-right"></i></span>
            <span>{{a}}</span>
          </li>
        </ul>

        <div class="detail-tech">
          <span class="tag" *ngFor="let t of exp.tech">{{t}}</span>
        </div>
      </div>
    </div>
  </div>
</section>
